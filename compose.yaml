x-base-service: &service-template
  image: flexivapps:v1.0
  volumes:
    - /tmp/.X11-unix:/tmp/.X11-unix:ro
    - ${XAUTHORITY}:/tmp/host.xauth:ro
  environment:
    - DISPLAY=${DISPLAY}
    - XAUTHORITY=/tmp/host.xauth
  cap_add:
    - SYS_ADMIN
  devices:
    - /dev/fuse
  networks:
    - flexiv_apps_bridge


services:
  ui:
    <<: *service-template
    container_name: UIApp
    entrypoint: ["/opt/flexiv/start-flexiv-element"]

  rca1:
    <<: *service-template
    container_name: RCA1
    # Each RCA pins its controller threads to host CPUs 2/3/4 (SchedConfig.hpp).
    # Give every instance a disjoint slice to avoid contention, e.g.:
    #   cpuset: "0-4"      # rca1
    #   cpuset: "5-9"      # rca2
    # Set RCA_GUI_DISABLE=1 (env below) to run headless, then the X11 mount and
    # DISPLAY/XAUTHORITY variables are no longer needed for this service.
    environment:
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=/tmp/host.xauth
      - RCA_ID=RCA111
    entrypoint: ["/opt/flexiv/start-rca"]

  rca2:
    <<: *service-template
    container_name: RCA2
    # See the note on rca1: use a different cpuset than rca1.
    environment:
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=/tmp/host.xauth
      - RCA_ID=RCA222
    entrypoint: ["/opt/flexiv/start-rca"]


networks:
  flexiv_apps_bridge:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.20.30.0/24
          gateway: 10.20.30.1
